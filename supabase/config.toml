# Hält verify_jwt für die Edge Functions fest, damit ein künftiges
# `supabase functions deploy <name>` nicht auf den CLI-Default (true)
# zurückfällt — die Functions prüfen Berechtigung selbst (employeeId in der
# DB, bzw. bei reset-password zusätzlich den mitgeschickten Bearer-Token im
# Code), nicht über die Plattform-JWT-Prüfung, die sonst schon den
# CORS-Preflight blockieren kann und auch für externe Kalender-Apps bei
# ics-feed nicht greifen darf.
[functions.ics-feed]
verify_jwt = false

[functions.set-password]
verify_jwt = false

[functions.reset-password]
verify_jwt = false

[functions.delete-employee]
verify_jwt = false

[functions.send-push]
verify_jwt = false
