server {
    listen 8099;
    root /www;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jedes Add-on-Update ersetzt /www komplett (Dockerfile: neues Image,
    # neue Hash-Dateinamen in /assets) — alte, im Browser gecachte
    # index.html/sw.js würden nach einem Update auf Assets verweisen bzw.
    # Requests bedienen wollen, die es im neuen Image nicht mehr gibt.
    # Das äußerte sich als Absturz/weiße Seite beim bloßen Neuladen und als
    # generelle Langsamkeit (der veraltete, gecachte Bundle-Code lief gegen
    # ein inzwischen geändertes Datenbankschema). Ohne explizites
    # Cache-Control griff hier Chromiums/Firefox' heuristisches Caching für
    # Last-Modified-Antworten.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-store";
    }

    location /runtime-config.js {
        add_header Cache-Control "no-store";
    }

    # Dateien in /assets/ tragen einen Inhalts-Hash im Namen (Vite-Build) —
    # ändert sich der Inhalt, ändert sich der Dateiname, daher hier bedenkenlos
    # langfristig cachebar.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
